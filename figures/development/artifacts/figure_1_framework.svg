ounded execution</text><text x="974" y="392" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#5D6B78">Allowlisted MR tools</text><text x="974" y="434" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#5D6B78">Digest-pinned Docker</text><path d="M1300,380 L1328,380 M1312,368 L1328,380 L1312,392" fill="none" stroke="#17212B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1340" y="270" width="380" height="230" rx="24" fill="#F4F7F9" stroke="#009E73" stroke-width="6"/><text x="1364" y="330" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17212B">Independent grading</text><text x="1364" y="392" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#5D6B78">Public observations</text><text x="1364" y="434" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#5D6B78">Hidden physics + fidelity</text><circle cx="115" cy="620" r="13" fill="#0072B2"/><text x="150" y="629" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">Direct</text><text x="410" y="629" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#5D6B78">choose + assess → execute</text><circle cx="115" cy="696" r="13" fill="#009E73"/><text x="150" y="705" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">Reactive</text><text x="410" y="705" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#5D6B78">choose → observe → assess</text><circle cx="115" cy="772" r="13" fill="#CC79A7"/><text x="150" y="781" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">Self-debug</text><text x="410" y="781" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#5D6B78">choose → observe → revise → assess</text><circle cx="115" cy="848" r="13" fill="#E69F00"/><text x="150" y="857" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">Plan + recovery</t