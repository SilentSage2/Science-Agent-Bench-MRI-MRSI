[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "science-agent-bench"
version = "0.1.0"
description = "A budget-controlled benchmark for MRI and MRSI agent workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ziyang Xu" }]
dependencies = ["numpy==2.2.4"]

[project.scripts]
sab-check-abstract = "science_agent.abstract_package:main"
sab-agent-smoke = "science_agent.agent_smoke:main"
sab-design-sensitivity = "science_agent.design_sensitivity:main"
sab-freeze-instances = "science_agent.frozen_instances:main"
sab-live-pilot = "science_agent.live_pilot:main"
sab-mri-recon-pilot = "science_agent.mri_recon_pilot:main"
sab-mrsi-nuisance-pilot = "science_agent.mrsi_nuisance_pilot:main"
sab-research-dry-run = "science_agent.research_dry_run:main"
sab-smoke = "science_agent.smoke:main"

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/science_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["science_agent"]
mypy_path = "src"
